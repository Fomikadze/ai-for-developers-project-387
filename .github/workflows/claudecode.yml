name: claude-code

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  claude:
    if: >-
      github.event.comment.user.type == 'User' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # На уровне job: комментарии, не прошедшие if, не занимают очередь задачи.
    concurrency:
      group: claude-code-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read # checkout ветки по умолчанию
      issues: read # текст issue и комментариев
      pull-requests: read # текст и diff PR
      id-token: write # обмен OIDC на токен Claude GitHub App
    steps:
      - name: Reject fork pull requests
        if: github.event.issue.pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          is_fork="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isCrossRepository --jq .isCrossRepository)"
          if [ "$is_fork" != "false" ]; then
            echo "::error::PR из форка: агент не запускается"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --model claude-opus-5-5 --max-turns 60
